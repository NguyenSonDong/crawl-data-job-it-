[project]
name = "crawl-data-job-it"
version = "1.0.0"
description = "Thu thập và khai phá dữ liệu tuyển dụng ngành Data & AI tại Việt Nam (ITEC3417)"
readme = "README.md"
# Python 3.12 là phiên bản chuẩn của dự án (xem .python-version).
# Cho phép 3.11 – 3.14 để máy nào đã có sẵn Python trong khoảng này vẫn cài được.
requires-python = ">=3.11,<3.15"
dependencies = [
    # --- Thu thập dữ liệu ---
    "playwright>=1.45,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<7",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
    # --- Xử lý & phân tích dữ liệu ---
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13.2,<0.15",
    "scikit-learn>=1.4,<2",
    "mlxtend>=0.23.1,<1",
    # --- Notebook ---
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.uv]
# Dự án dạng script/notebook, không cần build thành package.
# uv.lock là "universal lock": một file dùng chung cho Windows, macOS
# (Intel + Apple Silicon) và Linux, nên mọi máy cài ra cùng phiên bản thư viện.
package = false
